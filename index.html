<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoCar Lifecycle Journey Map</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
    </header>

    <div class="chart-wrap">
      <svg id="wave" viewBox="0 0 1400 480" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="bands">
      <div class="band-row" id="stageRow"></div>
      <div class="band-row" id="funnelRow"></div>
    </div>

    <div class="legend" id="legend"></div>

    <footer class="note">Hover or tap a touchpoint for detail. Data-driven from data.json &mdash; update content there without touching this page.</footer>
  </div>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const W = 1400, H = 480;
const baseline = 340, amplitude = 150, cx = 700, sigma = 300;

function curveY(x) {
  return baseline - amplitude * Math.exp(-((x - cx) ** 2) / (2 * sigma ** 2));
}

function el(tag, attrs, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}

function buildBandRow(container, bands, total, cellClassFn, labelFn) {
  container.innerHTML = "";
  bands.forEach(b => {
    const count = b.span[1] - b.span[0] + 1;
    const div = document.createElement("div");
    div.className = "band-cell " + cellClassFn(b);
    div.style.flex = count + " 1 0";
    div.textContent = labelFn(b);
    container.appendChild(div);
  });
}

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('eyebrow').textContent = data.meta.eyebrow;
    document.getElementById('title').textContent = data.meta.title;
    document.getElementById('subtitle').textContent = data.meta.subtitle;

    const svg = document.getElementById('wave');
    const n = data.touchpoints.length;
    const xs = [];
    for (let i = 0; i <= 200; i++) xs.push(60 + i * (1340 - 60) / 200);
    const pts = xs.map(x => [x, curveY(x)]);
    const pathD = "M " + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L ");
    const fillD = pathD + ` L ${xs[xs.length-1].toFixed(1)},${(baseline+20).toFixed(1)} L ${xs[0].toFixed(1)},${(baseline+20).toFixed(1)} Z`;

    el("path", { d: fillD, fill: "#083b3a", opacity: "0.95" }, svg);
    el("path", { d: pathD, fill: "none", stroke: "#bef19f", "stroke-width": "4" }, svg);

    const markerXs = [];
    for (let i = 0; i < n; i++) markerXs.push(100 + i * (1300 - 100) / (n - 1));

    const tooltip = document.getElementById('tooltip');
    const chartWrap = document.querySelector('.chart-wrap');

    data.touchpoints.forEach((tp, i) => {
      const x = markerXs[i];
      const dotY = curveY(x);
      const stemH = i % 2 === 0 ? 55 : 150;
      const labelY = dotY - stemH;
      const nLines = 1;
      const g = el("g", { class: "marker " + (tp.live ? "live" : "gap"), tabindex: "0" }, svg);
      el("line", { x1: x, y1: dotY, x2: x, y2: labelY + 10, stroke: "#8da68f", "stroke-width": "1.5" }, g);
      el("circle", {
        cx: x, cy: dotY, r: 7,
        fill: tp.live ? "#bef19f" : "#f3f3f3",
        stroke: tp.live ? "#083b3a" : "#8da68f",
        "stroke-width": "2.5"
      }, g);
      const words = tp.label.split(" ");
      const mid = Math.ceil(words.length / 2);
      const line1 = words.slice(0, mid).join(" ");
      const line2 = words.slice(mid).join(" ");
      const text = el("text", { x, y: labelY - 6, "text-anchor": "middle", class: "label", "font-size": "14.5" }, g);
      el("tspan", { x, dy: 0 }, text).textContent = line2 ? line1 : tp.label;
      if (line2) el("tspan", { x, dy: 16 }, text).textContent = line2;
      const sym = el("text", { x, y: labelY + 10, "text-anchor": "middle", "font-size": "11", fill: tp.live ? "#083b3a" : "#8da68f" }, g);
      sym.textContent = tp.live ? "\u2713" : "\u2013";

      function showTip(evt) {
        tooltip.innerHTML = `<span class="tip-title">${tp.label} \u2014 ${tp.live ? 'Live' : 'Gap'}</span>${tp.description}`;
        const wrapRect = chartWrap.getBoundingClientRect();
        const svgRect = svg.getBoundingClientRect();
        const scaleX = svgRect.width / W;
        const scaleY = svgRect.height / H;
        const left = (svgRect.left - wrapRect.left) + x * scaleX;
        const top = (svgRect.top - wrapRect.top) + Math.min(labelY - 20, dotY - 20) * scaleY;
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(top, 10) + "px";
        tooltip.classList.add("visible");
      }
      function hideTip() { tooltip.classList.remove("visible"); }

      g.addEventListener("mouseenter", showTip);
      g.addEventListener("mouseleave", hideTip);
      g.addEventListener("focus", showTip);
      g.addEventListener("blur", hideTip);
      g.addEventListener("touchstart", (e) => { e.preventDefault(); showTip(); setTimeout(hideTip, 3000); });
    });

    buildBandRow(
      document.getElementById('stageRow'),
      data.stageBands,
      n,
      b => "style-" + b.style,
      b => b.label
    );

    buildBandRow(
      document.getElementById('funnelRow'),
      data.funnelBands,
      n,
      b => "funnel" + (b.label === "Retention" ? " retention" : ""),
      b => b.label
    );

    const legend = document.getElementById('legend');
    legend.innerHTML = `
      <div class="legend-item"><span class="dot live"></span>${data.meta.legend.live}</div>
      <div class="legend-item"><span class="dot gap"></span>${data.meta.legend.gap}</div>
    `;
  })
  .catch(err => {
    document.querySelector('.page').innerHTML = '<p style="color:#5f5e5a">Could not load data.json &mdash; make sure this page is served over http(s) (e.g. GitHub Pages), not opened directly as a local file.</p>';
    console.error(err);
  });
</script>
</body>
</html>
